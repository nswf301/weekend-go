<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>부스 QR 인쇄</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css">
  <style>
    :root {
      --text: #2b2320;
      --muted: #6d635d;
      --point: #f36458;
      --line: #e8ded6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4efe9;
      color: var(--text);
      font-family: 'SUIT', -apple-system, 'Malgun Gothic', sans-serif;
      font-size: 16px;
    }

    .top {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px 8px;
    }

    .top h1 { font-size: 24px; margin: 0 0 10px; }

    .top p {
      color: var(--muted);
      line-height: 1.7;
      margin: 0 0 8px;
    }

    .top code {
      background: #fff;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
    }

    .print-btn {
      margin: 10px 0 20px;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      background: var(--point);
      color: #fff;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .warn { color: #b4342a; font-size: 18px; }

    /* ---------- 부스 한 장 ---------- */
    .sheet {
      --c1: #0f766e;
      --c2: #2563eb;
      --ink: #0f172a;
      --sub: #475569;
      position: relative;
      overflow: hidden;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto 24px;
      padding: 16mm 24mm 0;
      background: #fff;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
    }

    .sheet > * { position: relative; }

    /* 위쪽 색 띠 */
    .sheet > .sheet-band {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 78mm;
      background:
        radial-gradient(circle at 88% 18%, rgba(255,255,255,.16) 0 22mm, transparent 22.2mm),
        radial-gradient(circle at 6% 96%, rgba(255,255,255,.10) 0 30mm, transparent 30.2mm),
        linear-gradient(120deg, var(--c1), var(--c2));
      border-radius: 0 0 16mm 16mm;
    }

    /* 맨 아래 얇은 띠 */
    .sheet > .sheet-foot {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 6mm;
      background: linear-gradient(120deg, var(--c1), var(--c2));
    }

    .sheet-event {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 999px;
      padding: 6px 26px;
      margin: 0 0 8mm;
    }

    .sheet-title {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5mm;
      margin: 0 0 7mm;
    }

    .sheet-pic-card {
      width: 66mm;
      height: 50mm;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 8mm;
      box-shadow: 0 3mm 8mm rgba(15,23,42,.18);
    }

    .sheet-pic {
      max-height: 40mm;
      max-width: 56mm;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .sheet-name {
      font-size: 62px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -1px;
      color: var(--ink);
    }

    /* QR — 네 귀퉁이에 스캔 틀 */
    .sheet-qr {
      --k: var(--c2);
      margin: 0 0 6mm;
      padding: 7mm;
      background:
        linear-gradient(var(--k), var(--k)) left top / 14mm 1.8mm,
        linear-gradient(var(--k), var(--k)) left top / 1.8mm 14mm,
        linear-gradient(var(--k), var(--k)) right top / 14mm 1.8mm,
        linear-gradient(var(--k), var(--k)) right top / 1.8mm 14mm,
        linear-gradient(var(--k), var(--k)) left bottom / 14mm 1.8mm,
        linear-gradient(var(--k), var(--k)) left bottom / 1.8mm 14mm,
        linear-gradient(var(--k), var(--k)) right bottom / 14mm 1.8mm,
        linear-gradient(var(--k), var(--k)) right bottom / 1.8mm 14mm,
        #fff;
      background-repeat: no-repeat;
    }

    .sheet-qr img,
    .sheet-qr canvas {
      width: 88mm !important;
      height: 88mm !important;
      display: block;
    }

    .sheet-qr table { display: none; }

    .sheet-guide {
      font-size: 30px;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 7mm;
    }

    .sheet-pin {
      background: #eef4ff;
      border-radius: 6mm;
      padding: 12px 48px;
    }

    .sheet-pin-label {
      font-size: 22px;
      color: var(--sub);
      margin: 0 0 2px;
    }

    .sheet-pin-value {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: 10px;
      margin: 0;
      color: var(--c2);
    }

    /* ---------- 인쇄 ---------- */
    @page { size: A4; margin: 0; }

    @media print {
      body { background: #fff; }
      .top { display: none; }
      .sheet {
        margin: 0;
        border: none;
        page-break-after: always;
        break-after: page;
      }
      .sheet:last-child { page-break-after: auto; break-after: auto; }
    }
  </style>
</head>
<body>
  <div class="top">
    <h1>부스 QR 인쇄판</h1>
    <p>부스 하나가 A4 한 장입니다. 아래 버튼을 누르고 <b>용지 A4·여백 없음</b>으로 인쇄하세요.</p>
    <p>QR이 가리키는 주소는 <code id="addr"></code> 입니다.</p>
    <p>부스 이름이나 네 자리 번호를 바꾸려면 <code>config.js</code>를 고친 뒤 이 화면을 다시 열면 됩니다.</p>
    <button class="print-btn" onclick="window.print()">인쇄하기</button>
  </div>
  <div id="sheets"></div>
  <script type="module" src="print.js"></script>
</body>
</html>
